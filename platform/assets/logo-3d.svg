<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Backlight Glow Filter -->
    <filter id="neonShieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00f0ff" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1d4ed8" flood-opacity="0.7" />
    </filter>

    <filter id="letterBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Platinum Chrome Metallic Gradients -->
    <linearGradient id="chromePlat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="chromeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shield Rim & Core Gradients -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="shieldCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#060c1d" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
  </defs>

  <!-- 3D Outer Cyber Shield -->
  <g filter="url(#neonShieldGlow)">
    <path d="M 250,25 L 455,90 C 455,300 355,418 250,475 C 145,418 45,300 45,90 Z" 
          fill="url(#shieldCore)" stroke="url(#shieldRim)" stroke-width="16" stroke-linejoin="round" />
    
    <path d="M 250,50 L 428,106 C 428,285 342,390 250,446 C 158,390 72,285 72,106 Z" 
          fill="none" stroke="url(#chromeCyan)" stroke-width="4" stroke-linejoin="round" opacity="0.8" />
  </g>

  <!-- PROMINENT, BOLD, HIGH-CONTRAST 3D 'TS' MONOGRAM -->
  <g filter="url(#letterBevel)">
    <!-- 3D Shadow/Extrusion -->
    <g transform="translate(0, 8)" opacity="0.5">
      <!-- Letter T Shadow -->
      <path d="M 110,105 L 390,105 L 390,175 L 290,175 L 290,410 L 210,410 L 210,175 L 110,175 Z" fill="#000000" />
      <!-- Letter S Shadow -->
      <path d="M 375,185 C 330,165 210,175 175,230 C 150,270 185,310 250,328 C 330,348 345,375 332,410 C 315,445 235,450 170,425 L 155,468 C 235,500 365,490 392,425 C 410,380 385,338 315,315 C 245,292 225,275 238,248 C 250,220 320,215 365,235 Z" fill="#000000" />
    </g>

    <!-- Intertwined Platinum Letter S -->
    <path d="M 375,185 C 330,165 210,175 175,230 C 150,270 185,310 250,328 L 262,298 C 212,282 195,260 210,238 C 228,210 305,205 355,225 Z" 
          fill="url(#chromeCyan)" stroke="#ffffff" stroke-width="2.5" />
    
    <path d="M 250,328 C 330,348 350,375 338,412 C 322,448 240,452 175,426 L 156,468 C 238,500 368,490 395,425 C 412,380 382,338 312,315 Z" 
          fill="url(#chromeCyan)" stroke="#ffffff" stroke-width="2.5" />

    <!-- Dominant, Massive Platinum Letter T (Foreground) -->
    <!-- Horizontal Crossbar -->
    <path d="M 105,100 L 395,100 L 395,172 L 292,172 L 292,172 L 208,172 L 105,172 Z" 
          fill="url(#chromePlat)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <!-- 3D Bevel Facet Top -->
    <polygon points="105,100 395,100 375,122 125,122" fill="#ffffff" opacity="0.9" />
    <!-- 3D Bevel Facet Bottom -->
    <polygon points="105,172 395,172 375,152 125,152" fill="#475569" opacity="0.7" />

    <!-- Vertical Stem -->
    <path d="M 208,172 L 292,172 L 292,410 L 208,410 Z" 
          fill="url(#chromePlat)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <!-- Stem Facet Left (Bright) -->
    <polygon points="208,172 250,172 250,410 208,410" fill="#ffffff" opacity="0.5" />
    <!-- Stem Facet Right (Dark) -->
    <polygon points="250,172 292,172 292,410 250,410" fill="#334155" opacity="0.45" />

    <!-- S Center Bridge Over Stem (Interlocking 3D Effect) -->
    <path d="M 195,310 C 238,324 275,335 320,352 L 332,322 C 290,307 250,296 208,282 Z" 
          fill="url(#chromePlat)" stroke="#38bdf8" stroke-width="2" />

    <!-- Center Cyan Cyber Core Diamond -->
    <polygon points="250,115 264,136 250,157 236,136" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="250" cy="136" r="4.5" fill="#ffffff" />
  </g>
</svg>