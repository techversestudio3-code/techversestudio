<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow Filter -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Bevel & Specular Filter -->
    <filter id="bevel3D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.8" />
    </filter>

    <!-- Deep Metallic Gradients -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Left 3D Facet Gradient -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Right 3D Facet Gradient -->
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Inner Core Hologram Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Metallic Specular Highlight -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Lock Shackle Chrome Gradient -->
    <linearGradient id="chromeShackle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="256" r="210" fill="#0284c7" opacity="0.12" filter="url(#shieldGlow)" />

  <!-- Main 3D Outer Shield Rim with Shadow -->
  <path d="M 256 42 
           L 436 108 
           C 436 290, 362 396, 256 468 
           C 150 396, 76 290, 76 108 
           Z" 
        fill="url(#shieldRim)" 
        filter="url(#bevel3D)" />

  <!-- Inner Recessed Bevel -->
  <path d="M 256 64 
           L 414 122 
           C 414 278, 348 372, 256 438 
           C 164 372, 98 278, 98 122 
           Z" 
        fill="#0b1329" />

  <!-- Left 3D Isometric Facet -->
  <path d="M 256 64 
           L 98 122 
           C 98 278, 164 372, 256 438 
           Z" 
        fill="url(#facetLeft)" 
        opacity="0.95" />

  <!-- Right 3D Isometric Facet (Lighter for 3D illumination) -->
  <path d="M 256 64 
           L 414 122 
           C 414 278, 348 372, 256 438 
           Z" 
        fill="url(#facetRight)" 
        opacity="0.82" />

  <!-- Specular 3D Reflection Sweep (Left Top to Right Bottom) -->
  <path d="M 256 64 
           L 414 122 
           C 360 170, 280 190, 150 170 
           L 98 122 
           Z" 
        fill="url(#specularGlint)" />

  <!-- Central Floating Cyber Hexagon Shield -->
  <g filter="url(#bevel3D)">
    <polygon points="256,150 340,198 340,294 256,342 172,294 172,198" 
             fill="#030712" 
             stroke="url(#coreGlow)" 
             stroke-width="6" 
             stroke-linejoin="round" />

    <!-- 3D Circuit Pathways inside Hexagon -->
    <path d="M 256 165 L 256 220 M 195 210 L 230 230 M 317 210 L 282 230" 
          stroke="#38bdf8" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.75" />

    <!-- The 3D Security Keyhole / Lock Core -->
    <!-- Shackle -->
    <path d="M 226 242 
             C 226 220, 286 220, 286 242 
             L 286 256 
             L 226 256 Z" 
          fill="none" 
          stroke="url(#chromeShackle)" 
          stroke-width="9" 
          stroke-linecap="round" />

    <!-- Lock Body -->
    <rect x="216" y="254" width="80" height="62" rx="12" 
          fill="url(#coreGlow)" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-opacity="0.6" />

    <!-- Keyhole -->
    <circle cx="256" cy="278" r="7" fill="#030712" />
    <polygon points="253,278 259,278 261,298 251,298" fill="#030712" />
  </g>

  <!-- Glowing Corner Nodes -->
  <circle cx="256" cy="64" r="5" fill="#38bdf8" />
  <circle cx="414" cy="122" r="5" fill="#38bdf8" />
  <circle cx="98" cy="122" r="5" fill="#38bdf8" />
  <circle cx="256" cy="438" r="6" fill="#06b6d4" />
</svg>
