<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_coda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a12" />
      <stop offset="100%" stop-color="#010a07" />
    </linearGradient>
    <radialGradient id="glow_coda" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_coda" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <filter id="shadow_coda" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(0,0,0,0.65)" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="340" fill="url(#bg_coda)" />
  <rect width="600" height="340" fill="url(#glow_coda)" />
  <rect width="600" height="340" fill="url(#grid_coda)" />

